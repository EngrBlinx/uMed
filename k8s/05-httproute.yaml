apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umed-app-route
  namespace: umed
spec:
  parentRefs:
    - name: umed-gateway
      namespace: nginx-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: umed-backend
          port: 4000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: umed-frontend
          port: 80