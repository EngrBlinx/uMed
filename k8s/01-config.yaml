apiVersion: v1
kind: Namespace
metadata:
  name: umed
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: umed-config
  namespace: umed
data:
  NODE_ENV: "production"
  PORT: "4000"
---
apiVersion: v1
kind: Secret
metadata:
  name: umed-secret
  namespace: umed
type: Opaque
stringData:
  POSTGRES_USER: "umed_admin"
  POSTGRES_PASSWORD: "ChangeMeStrongPassword123!"
  POSTGRES_DB: "umed_clinic"
  DATABASE_URL: "postgresql://umed_admin:ChangeMeStrongPassword123!@umed-postgres.umed.svc.cluster.local:5432/umed_clinic"