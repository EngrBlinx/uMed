name: Build and Deploy uMed to Kubernetes

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  ci-checks:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Typecheck Backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run typecheck

      - name: Lint & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  build-and-push:
    name: Build & Push Docker Images
    needs: ci-checks
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase owner and commit tag
        id: meta
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/umed-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/umed-backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/umed-frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/umed-frontend:latest

  deploy:
    name: Deploy to Azure K8s Cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Kubernetes manifests to control plane
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: nnadozie
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "k8s/*"
          target: "~/"

      - name: Apply manifests and roll out new images
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: nnadozie
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            kubectl apply -f ~/k8s/
            kubectl set image deployment/umed-backend backend=ghcr.io/${{ needs.build-and-push.outputs.owner }}/umed-backend:${{ needs.build-and-push.outputs.image_tag }} -n umed
            kubectl set image deployment/umed-frontend frontend=ghcr.io/${{ needs.build-and-push.outputs.owner }}/umed-frontend:${{ needs.build-and-push.outputs.image_tag }} -n umed
            kubectl rollout status deployment/umed-postgres -n umed --timeout=120s
            kubectl rollout status deployment/umed-backend -n umed --timeout=120s
            kubectl rollout status deployment/umed-frontend -n umed --timeout=120s